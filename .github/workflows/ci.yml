name: CI

# On every push to feat/m1r-integration, a green run also deploys the playable
# build to https://kwedey.github.io/wanderblade/ with this run's Playwright
# report at /report/.
on:
  push:
    branches: [main, feat/m1r-integration]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      # The full 3-day run is sim/test/gate.test.ts inside verify; this smokes the CLI.
      - name: Economy simulator CLI must be ALL PASS
        run: |
          npm run sim -- --quick --days 3 --seeds 1 | tee sim-ci.log
          grep -q '^ALL PASS' sim-ci.log || { echo '::error::sim reported a FAIL'; exit 1; }

  # The image tag comes from the pinned @playwright/test, so the browser under
  # test, the committed screenshots and the runner can never drift apart.
  playwright-image:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pin.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "name=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  # Uploads the HTML report as the `playwright-report` artifact, pass or fail.
  e2e:
    needs: playwright-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.playwright-image.outputs.name }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/m1r-integration'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: cp -R app/dist-pages site
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: site/report
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: pages
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
