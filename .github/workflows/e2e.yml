name: e2e

# The Playwright suite, called by CI on every PR and by Pages before a deploy.
# Uploads the HTML report as the `playwright-report` artifact, pass or fail.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The image tag comes from the pinned @playwright/test, so the browser under
  # test, the committed screenshots and the runner can never drift apart.
  image:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pin.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        run: |
          version=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          echo "name=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_OUTPUT"

  playwright:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.image.outputs.name }}
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
