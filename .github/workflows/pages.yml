name: Pages

# The playable build at https://kwedey.github.io/wanderblade/ with the
# Playwright report of the same commit at /report/. Deploys only on green.
on:
  push:
    branches: [feat/m1r-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yml

  build:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: cp -R app/dist site
      - uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: site/report
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
